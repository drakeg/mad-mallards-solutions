name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile server.py
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Browser and accessibility verification
        run: |
          MMS_DATABASE="${{ runner.temp }}/web-test.sqlite3" python server.py &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/health > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
          npm run test:a11y
      - run: docker build -t mad-mallards-solutions:test .
